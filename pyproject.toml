[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "artifact-eraser"
version = "1.0.0"
description = "Windows anti-forensics artifact erasure tool"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "python-registry>=1.3.1",
    "olefile>=0.47",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cleaner*"]
